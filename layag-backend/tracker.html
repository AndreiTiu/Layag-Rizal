<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAYAG Live Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 12px 16px; background: #1e293b; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  input, select, button { padding: 6px 10px; border-radius: 6px; border: none; font-size: 14px; }
  button { background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  button.off { background: #ef4444; color: #7f1d1d; }
  #status { font-size: 13px; background: #0f172a; padding: 5px 10px; border-radius: 6px; flex: 1; min-width: 220px; }
  #map { height: 60vh; margin: 12px; border-radius: 10px; }
  #toggleView { margin: 0 12px 12px; padding: 8px 14px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🛵 LAYAG Live Tracker</h1>
  <label>Parcel ID <input id="parcelId" type="number" value="11" style="width:80px;"></label>
  <label>Vehicle <select id="vehicle">
    <option>MOTORCYCLE</option><option>VAN</option><option>MINIVAN</option><option>TRUCK</option>
  </select></label>
  <button id="startBtn">▶ Start tracking</button>
  <div id="status">Ready. Press Start — you ARE the courier.</div>
</header>

<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
  <button id="toggleView" onclick="showRoute()">🗺 View route map</button>
  <button id="watchBtn" onclick="toggleWatch()" style="background:#f59e0b; color:#fff;">🔴 Live watch (receiver mode)</button>
  <span id="watchStatus" style="font-size:12px;"></span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE = location.origin;         // http://localhost:8080 (or tunnel URL)
const parcelIdEl = document.getElementById('parcelId');
const vehicleEl  = document.getElementById('vehicle');
const statusEl   = document.getElementById('status');
const startBtn   = document.getElementById('startBtn');

let watchId = null;
let map = null, marker = null, routeLine = null, lastPoint = null;

// ---- 1. REAL GPS: watchPosition tells us where the phone is ----
startBtn.onclick = () => {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; stopLive(); return; }
  if (!navigator.geolocation) { statusEl.textContent = "No GPS on this device."; return; }

  // Ask browser permission, then call us on every movement.
  watchId = navigator.geolocation.watchPosition(
    onPosition,                      // got a real lat/lng
    err => statusEl.textContent = "GPS error: " + err.message,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
  startBtn.textContent = "■ Stop";
  startBtn.classList.add('off');
  statusEl.textContent = "Tracking... waiting for first fix.";
};

function onPosition(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const parcelId = parcelIdEl.value;
  const vehicle = vehicleEl.value;
  statusEl.textContent = `${new Date().toLocaleTimeString()} — ${lat.toFixed(6)}, ${lng.toFixed(6)} (live)`;

  // ---- 2. SYSTEM: send the real coordinate to our Java backend ----
  fetch(BASE + "/api/gps", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: `parcelId=${parcelId}&lat=${lat}&lng=${lng}`
  }).then(r => r.json()).then(d => {
    if (d.message) statusEl.textContent = `${new Date().toLocaleTimeString()} — sent ${lat.toFixed(6)}, ${lng.toFixed(6)} (${d.message})`;
  }).catch(() => statusEl.textContent = "Backend not reachable — start api.ApiServer");
}

// ---- 3. MAP: draw the route the backend stored ----
function showRoute() {
  if (!map) {
    map = L.map('map').setView([14.58, 121.13], 12);          // Rizal view
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  }
  map.scrollWheelZoom.enable();
  const parcelId = parcelIdEl.value;
  fetch(BASE + "/api/gps?parcelId=" + parcelId)
    .then(r => r.json())
    .then(data => {
      if (!data.route || data.route.length === 0) { alert("No route points yet. Start tracking and move!"); return; }
      const points = data.route.map(p => [p.lat, p.lng]);
      if (marker) marker.remove();
      marker = L.marker(points[points.length - 1]).addTo(map);   // latest position
      if (routeLine) routeLine.remove();
      routeLine = L.polyline(points, {color: '#22c55e'}).addTo(map);          // the path so far
      map.fitBounds(L.latLngBounds(points).pad(0.15));
    })
    .catch(() => alert("Backend not reachable"));
}
function stopLive() { startBtn.textContent = "▶ Start tracking"; startBtn.classList.remove('off'); statusEl.textContent = "Stopped."; }

// ---- 4. RECEIVER MODE: auto-refresh the map every 2s (live watch) ----
let watchTimer = null;
function toggleWatch() {
  if (watchTimer) {
    clearInterval(watchTimer); watchTimer = null;
    document.getElementById('watchBtn').textContent = "🔴 Live watch (receiver mode)";
    document.getElementById('watchStatus').textContent = "";
    return;
  }
  showRoute();
  document.getElementById('watchBtn').textContent = "⏹ Stop live watch";
  document.getElementById('watchStatus').textContent = "Watching parcel " + parcelIdEl.value + " — updates every 2s";
  watchTimer = setInterval(showRoute, 2000);   // poll the backend route
}
</script>
</body>
</html>

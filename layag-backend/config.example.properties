# LAYAG server configuration (example — copy to config.properties).
# Precedence: config.properties > environment variables (LAYAG_*) > defaults.
# GitHub NEVER contains secrets. config.properties is gitignored.

db.url = jdbc:mysql://localhost:3306/couriersystem
db.user = root
db.password =

# http.threads = 10

# Browser origins allowed to call the API (comma-separated). The Spring Boot
# landing page runs on 8081; add more origins as needed.
cors.allowedOrigins = http://localhost:8081

# Brute-force protection on /api/login and /api/register.
# security.login.maxFailures = 5
# security.register.maxFailures = 10
# security.login.lockMs = 900000

# Real email OTP (optional) via the Resend REST API — free tier = 100/day.
#   Set mail.resendApiKey to a Resend API key (re_...) to send REAL codes.
#   Leave it blank to keep the simulated DemoMailer (console + /api/dev/mailbox);
#   the project then runs fully offline for the demo/defense.
# Resend note: until you verify a sending domain, "from" must be
#   "LAYAG <onboarding@resend.dev>" AND the recipient must be the
#   email address you registered at Resend. Add/verify a domain to send to anyone.
# Production mode REQUIRES a real key (server refuses to start without it).
mail.from = LAYAG <onboarding@resend.dev>
mail.resendApiKey =

# production = true
#   When true (or env LAYAG_PRODUCTION=true), any missing value here throws
#   instead of silently using a built-in default. file:// pages (Origin: null)
#   are also rejected. Enable only for the real deployment.